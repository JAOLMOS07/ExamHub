<!DOCTYPE html>
<html lang="es" data-theme="examhub">
  <head>
    <meta charset="utf-8" />
    <title>ExamHub — Simulacros tipo Saber 11 calificados con el celular</title>
    <meta
      name="description"
      content="Simulacros tipo Saber 11 en papel, calificados con el celular, con informes por competencia para colegios de Colombia."
    />
    <base href="/" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExamHub" />
    <meta property="og:title" content="ExamHub — Simulacros tipo Saber 11 calificados con el celular" />
    <meta property="og:description" content="Simulacros en papel, hojas con el nombre de cada estudiante e informes por competencia. Del lápiz al resultado, en segundos." />
    <meta property="og:image" content="https://exam-hub-woad.vercel.app/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16205a" />

    <!-- App instalable (PWA) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ExamHub" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />

    <!-- Tipografía de marca: Sora (títulos), Atkinson Hyperlegible (textos), Source Serif Pro (lecturas). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!--
      KaTeX CSS — cargado como <link> separado además del @import de
      styles.css. El helper que genera el PDF necesita pasarle este
      href al iframe aislado donde renderiza las fórmulas; si solo
      estuviera por @import (in-bundle), no podría encontrarlo.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script>
      // Tema guardado (ThemeService): se aplica antes de pintar.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("eh-theme-boot") || "null");
          var dark = t ? t.dark : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          if (dark) {
            root.classList.add("dark");
            root.setAttribute("data-theme", "examhub-dark");
          }
          if (t && t.vars) for (var k in t.vars) root.style.setProperty(k, t.vars[k]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="mat-typography font-sans antialiased bg-base-200 text-base-content">
    <app-root></app-root>
    <noscript>ExamHub necesita JavaScript para funcionar.</noscript>
  </body>
</html>
