@if (question) {
  <div
    class="group rounded-xl border bg-white transition"
    [class.border-amber-200]="isPassage"
    [class.bg-amber-50]="isPassage"
    [class.border-slate-200]="!isPassage"
    [class.hover:border-slate-300]="!isPassage"
  >
    <div class="flex items-start gap-2.5 p-2.5">
      @if (isPassage) {
        <span class="shrink-0 w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center">
          <app-icon [icon]="'menu_book'" />
        </span>
      } @else {
        <span class="shrink-0 w-7 h-7 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold flex items-center justify-center">
          {{ index }}
        </span>
      }
      <button type="button" class="flex-1 min-w-0 text-left" (click)="expanded = !expanded">
        @if (isPassage) {
          <span class="eh-overline !text-amber-700">Lectura</span>
          <span class="block text-sm font-medium text-slate-900 truncate">{{ question.name }}</span>
        } @else {
          @if (testShort) {
            <span class="eh-test mb-1" [ngClass]="'eh-test--' + question.test">{{ testShort }}</span>
          }
          <span class="block text-sm text-slate-800 leading-snug" [class.line-clamp-2]="!expanded">
            <math-text [content]="question.name"></math-text>
          </span>
        }
      </button>
      <button
        type="button"
        class="shrink-0 eh-icon-btn !w-7 !h-7 opacity-60 group-hover:opacity-100 hover:!text-red-600 hover:!bg-red-50"
        (click)="removeQuestion(question)"
        title="Quitar del examen"
      >
        <app-icon [icon]="'close'" />
      </button>
    </div>

    @if (expanded) {
      <div class="px-3 pb-3 pl-12">
        @if (isPassage) {
          <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line line-clamp-6">{{ question.passageText }}</p>
        } @else if (question.options?.length) {
          <ol class="space-y-1">
            @for (option of question.options; track k; let k = $index) {
              <li
                class="flex gap-2 text-sm rounded-md px-2 py-1"
                [class.bg-emerald-50]="showAnswer && option.correct"
                [class.text-emerald-800]="showAnswer && option.correct"
                [class.font-medium]="showAnswer && option.correct"
                [class.text-slate-600]="!(showAnswer && option.correct)"
              >
                <span class="font-semibold">{{ ALPHABET[k] }}.</span>
                <math-text [content]="option.content"></math-text>
              </li>
            }
          </ol>
          <button type="button" class="mt-2 text-xs font-medium text-brand-700 hover:underline" (click)="showAnswer = !showAnswer">
            {{ showAnswer ? "Ocultar respuesta" : "Ver respuesta" }}
          </button>
        }
      </div>
    }
  </div>
}
