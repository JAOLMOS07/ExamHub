<form class="w-[min(440px,92vw)] bg-white" (ngSubmit)="!folderNameInput.invalid && addFolder()">
  <header class="px-6 pt-5 pb-2">
    <h2 class="text-lg font-semibold text-slate-900">{{ editMode ? "Renombrar carpeta" : "Nueva carpeta" }}</h2>
    <p class="text-sm text-slate-500 mt-0.5">Organiza por área, grado, periodo o tema.</p>
  </header>
  <div class="px-6 py-4">
    <label class="eh-field">
      <span>Nombre</span>
      <input
        type="text"
        class="eh-input"
        placeholder="Matemáticas 11° · Periodo 1"
        [(ngModel)]="folderName"
        name="folderName"
        #folderNameInput="ngModel"
        required
        minlength="3"
        maxlength="60"
        cdkFocusInitial
      />
      @if (folderNameInput.invalid && folderNameInput.touched) {
        <small class="!text-red-600">Escribe entre 3 y 60 caracteres.</small>
      }
    </label>
  </div>
  <footer class="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
    <button type="button" class="eh-btn eh-btn--ghost" (click)="onNoClick()">Cancelar</button>
    <button type="submit" class="eh-btn eh-btn--primary" [disabled]="folderNameInput.invalid">
      {{ editMode ? "Guardar" : "Crear carpeta" }}
    </button>
  </footer>
</form>
