<div
  class="card bg-slate-200 shadow-xl h-[100%] cursor-pointer hover:bg-slate-300 hover:shadow-2xl transition"
>
  <div class="card-body">
    <div class="flex items-center gap-2 mb-2">
      <span
        class="badge badge-sm badge-neutral gap-1 text-xs"
        [title]="kindLabel"
      >
        <app-icon [icon]="kindIcon" />
        {{ kindLabel }}
      </span>
      @if (imagesEnabled && question.imageUrl) {
        <span
          class="badge badge-sm badge-info gap-1 text-xs"
          title="Tiene imagen"
        >
          <app-icon [icon]="'image'" />
        </span>
      }
    </div>
    @if (imagesEnabled && question.imageUrl) {
      <img
        [src]="question.imageUrl"
        alt="Imagen de la pregunta"
        class="w-full max-h-32 object-contain rounded mb-2 bg-white"
        loading="lazy"
      />
    }
    <h3 class="break-words card-title no-select line-clamp">
      <math-text [content]="question.name"></math-text>
    </h3>
  </div>
  <figure class="bg-slate-600">
    <div class="my-2">
      <button (click)="copyQuestions()" class="btn btn-sm btn-circle btn-ghost">
        @if (questionCopied) {
        <app-icon class="text-slate-400 hover:text-white" [icon]="'check'" />
        }@else {
        <app-icon
          class="text-slate-400 hover:text-white"
          [icon]="'file_copy'"
        />
        }
      </button>
      <button
        (click)="editQuestionDialog()"
        class="btn btn-sm btn-circle btn-ghost"
      >
        <app-icon class="text-slate-400 hover:text-white" [icon]="'create'" />
      </button>
      <button class="btn btn-sm btn-circle btn-ghost">
        @if (questionSelected()) {
        <app-icon
          class="text-white"
          [icon]="'playlist_add_check'"
          (click)="removeQuestionCurrentExam()"
        />
        }@else {
        <app-icon
          class="text-slate-400 hover:text-white"
          [icon]="'playlist_add'"
          (click)="addQuestionCurrentExam()"
        />
        }
      </button>
      <button
        class="btn btn-sm btn-circle btn-ghost"
        [swal]="{
          title: '¿Desea eliminar esta pregunta?',
          showDenyButton: true,
          icon: 'question',
          confirmButtonText: 'Si',
          denyButtonText: 'No',
        }"
        (confirm)="deleteDocument()"
      >
        <app-icon
          class="text-slate-400 hover:text-white"
          [icon]="'delete_outline'"
        />
      </button>
    </div>
  </figure>
</div>
