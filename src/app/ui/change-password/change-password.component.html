<!-- ============== Modal overlay ============== -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
  (click)="onCancel()"
>
  <!-- Card -->
  <div
    class="w-full max-w-md bg-white rounded-2xl shadow-card border border-slate-200 p-6 sm:p-8"
    (click)="$event.stopPropagation()"
  >
    <header class="mb-5">
      <h2 class="text-xl font-bold text-slate-900 tracking-tight">
        Cambiar contraseña
      </h2>
      <p class="text-sm text-slate-500 mt-1">
        Por seguridad necesitamos confirmar tu contraseña actual antes de
        guardar la nueva.
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Contraseña actual -->
      <div>
        <label
          for="currentPassword"
          class="block text-sm font-medium text-slate-700 mb-1"
        >
          Contraseña actual
        </label>
        <div class="relative">
          <input
            id="currentPassword"
            [type]="showCurrent ? 'text' : 'password'"
            placeholder="••••••••"
            formControlName="currentPassword"
            autocomplete="current-password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-10 text-slate-900 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 focus:outline-none transition"
          />
          <button
            *ngIf="allowReveal"
            type="button"
            (click)="showCurrent = !showCurrent"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600"
            tabindex="-1"
            [attr.aria-label]="showCurrent ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <svg *ngIf="!showCurrent" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showCurrent" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Nueva contraseña -->
      <div>
        <label
          for="newPassword"
          class="block text-sm font-medium text-slate-700 mb-1"
        >
          Nueva contraseña
        </label>
        <div class="relative">
          <input
            id="newPassword"
            [type]="showNew ? 'text' : 'password'"
            placeholder="Mínimo 6 caracteres"
            formControlName="newPassword"
            autocomplete="new-password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-10 text-slate-900 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 focus:outline-none transition"
          />
          <button
            *ngIf="allowReveal"
            type="button"
            (click)="showNew = !showNew"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600"
            tabindex="-1"
            [attr.aria-label]="showNew ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <svg *ngIf="!showNew" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showNew" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        <p
          *ngIf="newPasswordCtrl?.touched && newPasswordCtrl?.errors?.['minlength']"
          class="text-xs text-red-600 mt-1"
        >
          Mínimo 6 caracteres.
        </p>
      </div>

      <!-- Confirmar -->
      <div>
        <label
          for="confirmPassword"
          class="block text-sm font-medium text-slate-700 mb-1"
        >
          Confirmar nueva contraseña
        </label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Repetí la nueva contraseña"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-brand-600 focus:ring-2 focus:ring-brand-200 focus:outline-none transition"
        />
        <p
          *ngIf="passwordsMismatch"
          class="text-xs text-red-600 mt-1"
        >
          Las contraseñas no coinciden.
        </p>
      </div>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-700"
      >
        {{ errorMessage }}
      </div>

      <!-- Acciones -->
      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isSubmitting"
          class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition disabled:opacity-50"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || isSubmitting"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold text-white transition shadow-sm hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
          style="background-color: #4338ca;"
          onmouseover="this.style.backgroundColor='#3730a3'"
          onmouseout="this.style.backgroundColor='#4338ca'"
        >
          {{ isSubmitting ? "Guardando…" : "Guardar contraseña" }}
        </button>
      </div>
    </form>
  </div>
</div>
