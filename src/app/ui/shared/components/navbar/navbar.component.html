<header class="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-slate-200">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-14 items-center justify-between gap-4">
      <!-- Logo -->
      <a routerLink="/home" class="flex items-center gap-2 group">
        <eh-logo [size]="30" />
      </a>

      <!-- Acceso rápido a las secciones principales -->
      <nav class="hidden md:flex flex-1 items-center justify-center gap-1">
        <a
          routerLink="/home"
          routerLinkActive="bg-slate-100 text-slate-900"
          [routerLinkActiveOptions]="{ exact: false }"
          class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition"
        >
          Banco
        </a>
        <a
          routerLink="/grade"
          routerLinkActive="bg-slate-100 text-slate-900"
          class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition inline-flex items-center gap-1.5"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9l3-3h4l2-2h4l2 2h4l3 3v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <circle cx="12" cy="14" r="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Calificar
        </a>
      </nav>

      <!-- Usuario -->
      @if (user) {
        <div class="dropdown dropdown-end">
          <div
            tabindex="0"
            role="button"
            class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-100 transition cursor-pointer"
          >
            <div
              class="h-8 w-8 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 text-white text-xs font-semibold flex items-center justify-center"
              style="background: linear-gradient(135deg, #6366f1, #4338ca);"
            >
              {{ initials }}
            </div>
            <span class="hidden sm:inline text-sm font-medium text-slate-700 max-w-[200px] truncate">
              {{ user.email }}
            </span>
            <svg
              class="hidden sm:inline w-4 h-4 text-slate-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19 9-7 7-7-7"
              />
            </svg>
          </div>
          <ul
            tabindex="0"
            class="menu menu-sm dropdown-content mt-2 z-[40] p-2 shadow-card bg-white rounded-box w-56 border border-slate-200"
          >
            <li class="menu-title">
              <span class="text-xs text-slate-400">Sesión activa</span>
            </li>
            <li class="px-3 py-1 text-xs text-slate-500 truncate">
              {{ user.email }}
            </li>
            <li class="border-t border-slate-100 mt-1 pt-1">
              <a routerLink="/preferences" class="hover:bg-slate-100">
                <app-icon [icon]="'tune'" />
                Preferencias
              </a>
            </li>
            <li>
              <a (click)="openChangePassword()" class="hover:bg-slate-100 cursor-pointer">
                <app-icon [icon]="'lock'" />
                Cambiar contraseña
              </a>
            </li>
            <li>
              <a (click)="logout()" class="text-red-600 hover:bg-red-50">
                <app-icon [icon]="'logout'" />
                Cerrar sesión
              </a>
            </li>
          </ul>
        </div>
      }
    </div>
  </div>
</header>

<!-- Modal de cambio de contraseña (controlado desde el dropdown) -->
<app-change-password
  *ngIf="showChangePassword"
  (close)="closeChangePassword()"
></app-change-password>
